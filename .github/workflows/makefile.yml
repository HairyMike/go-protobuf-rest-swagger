name: Makefile CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install protoc and plugins
      run: make install_protoc install_protoc_gen_go install_protoc_gen_go_grpc install_protoc_gen_openapi install_google_apis

    - name: Generate Go and Swagger code
      run: make generate

    - name: Verify the generated files
      run: git diff --exit-code

    - name: Upload Swagger JSON
      id: upload-swagger
      uses: actions/upload-artifact@v3
      with:
        name: swagger-json
        path: ./swagger/*.json

    - name: Clean generated files
      run: make clean
